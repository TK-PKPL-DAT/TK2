<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TK2 PKPL{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="{% block body_class %}bg-gray-50{% endblock %} min-h-screen flex flex-col transition-colors duration-500" {% if bg_color %}style="background-color: {{ bg_color }} !important;"{% endif %} {% block body_style %}{% endblock %}>

    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="text-xl font-bold text-gray-900">TK2 PKPL</a>
            <div class="flex items-center gap-4">
                {% if user.is_authenticated %}
                    <span class="text-gray-500 text-sm hidden sm:block">{{ user.email }}</span>
                    <a href="{% url 'account_logout' %}" class="bg-red-500 hover:bg-red-600 text-white text-sm font-semibold px-5 py-2 rounded-lg transition-colors">Logout</a>
                {% else %}
                    <a href="{% url 'account_login' %}" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-5 py-2 rounded-lg transition-colors">Sign In</a>
                {% endif %}
            </div>
        </div>
    </nav>

    {% if user.is_authenticated %}
    <div class="bg-gray-900 text-white px-6 py-2 flex justify-center items-center shadow-md relative z-40">
        <form action="{% url 'edit_background' %}" method="POST" class="flex items-center gap-4">
            {% csrf_token %}
            <label for="bg_color" class="text-sm font-medium tracking-wide">Ubah Warna Website:</label>
            <input type="color" id="bg_color" name="bg_color" value="{{ bg_color|default:'#f9fafb' }}" class="h-8 w-14 cursor-pointer rounded border-0 p-0">
            <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-md text-sm font-bold transition-colors">
                Terapkan
            </button>
        </form>
    </div>
    {% endif %}

    <main class="flex-1 {% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t border-gray-200 py-4 px-8 flex justify-between items-center text-xs text-gray-400">
        <span>© 2026 Kelompok Dery Andreas Tampubolon. ALL RIGHTS RESERVED.</span>
    </footer>

</body>
</html>
